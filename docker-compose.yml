# ---------------------------------------------------------------------------
# docker-compose.yml — pronto para EasyPanel e para `docker compose up -d`.
# NÃO usar a chave `version:` (obsoleta).
#
# Modo padrão: câmera IP ICSEE/YOOSEE (não precisa de device no host).
# Para webcam USB em DVR_MODO_OP=usb, descomente o bloco `devices`/`group_add`
# ao final deste arquivo — o container falha ao subir se o device não existir.
# ---------------------------------------------------------------------------
services:
  dvr:
    build: .
    image: dvr-yoosee:latest
    # Sem `container_name`: o EasyPanel (e o próprio Compose) alertam que nomes
    # fixos colidem entre projetos. O serviço continua acessível como `dvr`.

    ports:
      - "2310:2310"

    environment:
      DVR_USER: ${DVR_USER:-admin}
      DVR_PASSWORD: ${DVR_PASSWORD:-changeme}
      TZ: ${TZ:-America/Sao_Paulo}

      # ---------------------------------------------------------------
      # MODO DE OPERAÇÃO — escolhe a fonte do vídeo:
      #   usb    = webcam /dev/video0 (OBRIGATÓRIO descomentar o bloco
      #            devices/group_add no fim do arquivo, senão o container
      #            nem sobe — e o stream fica "sem sinal")
      #   icsee  = câmera IP Xiongmai/iCSee/Xmeye via RTSP na 554 (a 34567 é o
      #            port do app iCSee/DVRIP, não serve RTSP)
      #   yoosee = câmera IP Yoosee via RTSP (554, fluxos onvif1/onvif2)
      # ---------------------------------------------------------------
      DVR_MODO_OP: ${DVR_MODO_OP:-usb}

      # --- Câmera IP (icsee/yoosee) ---
      DVR_IPCAM_HOST: ${DVR_IPCAM_HOST:-}
      DVR_IPCAM_PORT: ${DVR_IPCAM_PORT:-}
      DVR_IPCAM_USER: ${DVR_IPCAM_USER:-admin}
      DVR_IPCAM_PASS: ${DVR_IPCAM_PASS:-}
      DVR_IPCAM_CHANNEL: ${DVR_IPCAM_CHANNEL:-}
      DVR_IPCAM_STREAM: ${DVR_IPCAM_STREAM:-}
      DVR_IPCAM_TRANSPORT: ${DVR_IPCAM_TRANSPORT:-tcp}
      # auto (padrão) | 1 (sempre re-encode) | 0 (nunca — filtros digitais off)
      DVR_IPCAM_TRANSCODE: ${DVR_IPCAM_TRANSCODE:-auto}
      # Auto-probe (modos IP): após 3 falhas rápidas seguidas do FFmpeg, testa
      # combinações porta/canal conhecidas (554/1 etc.) com ffprobe e usa a
      # primeira que abrir. 0 = desliga (vamos encontrar a URL manual).
      DVR_AUTO_PROBE: ${DVR_AUTO_PROBE:-1}
      # Sobrescreve a URL RTSP inteira (firmwares exóticos). Senha em texto;
      # mantenha este valor só no .env. Defini-la desliga o auto-probe.
      DVR_IPCAM_URL: ${DVR_IPCAM_URL:-}

      # --- Qualidade de imagem/gravação (ajuste pelo painel) ---
      DVR_VIDEO_SIZE: ${DVR_VIDEO_SIZE:-640x480}
      DVR_VIDEO_BITRATE: ${DVR_VIDEO_BITRATE:-1200k}
      DVR_FRAMERATE: ${DVR_FRAMERATE:-15}
      # Vazio = melhor compressão, +~1s de latência no ao vivo.
      DVR_X264_TUNE: ${DVR_X264_TUNE-zerolatency}
      # Deixe vazio se a câmera negociar sozinha; use `mjpeg` se a imagem falhar.
      DVR_INPUT_FORMAT: ${DVR_INPUT_FORMAT:-}

      # --- Filtros / controles da câmera ---
      # none|night|ir|bright|sharp|mirror|flip|rotate180
      DVR_IMAGE_PRESET: ${DVR_IMAGE_PRESET:-none}
      # Cadeia FFmpeg livre, somada ao preset.
      DVR_VIDEO_FILTERS: ${DVR_VIDEO_FILTERS:-}
      # Controles v4l2-ctl, ex.: brightness=128,contrast=32
      DVR_V4L2_CTRLS: ${DVR_V4L2_CTRLS:-}

      # --- Avançado ---
      DVR_RECORD_SOURCE: ${DVR_RECORD_SOURCE:-hls}
      DVR_SEGMENT_SECONDS: ${DVR_SEGMENT_SECONDS:-600}
      DVR_RETENTION_SECONDS: ${DVR_RETENTION_SECONDS:-86400}
      DVR_TUNNEL_TTL: ${DVR_TUNNEL_TTL:-14400}
    volumes:
      # Gravações persistentes no host (MP4). Cuidado com o tamanho em disco.
      - ./recordings:/app/recordings

    # Segmentos HLS são descartáveis: mantê-los em RAM evita desgaste do SSD.
    tmpfs:
      - /app/hls:size=64m,mode=1777

    # ---------------------------------------------------------------
    # APENAS MODO USB (DVR_MODO_OP=usb): mapeie a webcam DESCOMENTANDO as
    # duas chaves abaixo. Padrão é câmera IP (icsee/yoosee via RTSP), que
    # não precisa de device — e hosts sem webcam FALHAM em subir o contai-
    # ner se /dev/video0 for mapeado sem existir.
    #
    # devices:
    #   - /dev/video0:/dev/video0
    # group_add:
    #   - video
    # ---------------------------------------------------------------

    # Sem `privileged: true` de propósito (o root já cobre o bind mount).

    restart: unless-stopped
