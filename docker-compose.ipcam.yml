# ---------------------------------------------------------------------------
# docker-compose.ipcam.yml — variante para câmera IP (icsee/yoosee) em hosts
# SEM webcam USB. Idêntico ao docker-compose.yml, porém SEM o mapeamento de
# /dev/video0 (o Docker falha ao criar o container se o device não existir).
#
# Se o host TEM webcam e você quer mantê-la disponível, use o docker-compose.yml
# normal com DVR_MODO_OP=usb (ou até deixe os devices — não atrapalham o RTSP).
#
# Configuração mínima no .env:
#   DVR_MODO_OP=icsee            # icsee | yoosee
#   DVR_IPCAM_HOST=192.168.1.15  # IP da câmera
#   DVR_IPCAM_PASS=sua_senha     # a mesma senha do app iCSee
# ---------------------------------------------------------------------------
services:
  dvr:
    build: .
    image: dvr-yoosee:latest

    ports:
      - "2310:2310"

    environment:
      DVR_USER: ${DVR_USER:-admin}
      DVR_PASSWORD: ${DVR_PASSWORD:-changeme}
      TZ: ${TZ:-America/Sao_Paulo}

      # Modo: icsee (porta NET 34567 ou 554) | yoosee (554, onvif1/onvif2).
      DVR_MODO_OP: ${DVR_MODO_OP:-icsee}

      # --- Câmera IP ---
      DVR_IPCAM_HOST: ${DVR_IPCAM_HOST:-}
      DVR_IPCAM_PORT: ${DVR_IPCAM_PORT:-}
      DVR_IPCAM_USER: ${DVR_IPCAM_USER:-admin}
      DVR_IPCAM_PASS: ${DVR_IPCAM_PASS:-}
      DVR_IPCAM_CHANNEL: ${DVR_IPCAM_CHANNEL:-}
      DVR_IPCAM_STREAM: ${DVR_IPCAM_STREAM:-}
      DVR_IPCAM_TRANSPORT: ${DVR_IPCAM_TRANSPORT:-tcp}
      DVR_IPCAM_TRANSCODE: ${DVR_IPCAM_TRANSCODE:-auto}
      DVR_IPCAM_URL: ${DVR_IPCAM_URL:-}

      # --- Qualidade do re-encode (vale só com filtro configurado ou
      #     DVR_IPCAM_TRANSCODE=1; por padrão o H.264 da câmera é copiado) ---
      DVR_VIDEO_BITRATE: ${DVR_VIDEO_BITRATE:-1200k}
      DVR_IMAGE_PRESET: ${DVR_IMAGE_PRESET:-none}
      DVR_VIDEO_FILTERS: ${DVR_VIDEO_FILTERS:-}

      # --- Avançado ---
      DVR_RECORD_SOURCE: ${DVR_RECORD_SOURCE:-hls}
      DVR_SEGMENT_SECONDS: ${DVR_SEGMENT_SECONDS:-600}
      DVR_RETENTION_SECONDS: ${DVR_RETENTION_SECONDS:-86400}
      DVR_TUNNEL_TTL: ${DVR_TUNNEL_TTL:-14400}

    volumes:
      # Gravações persistentes no host (MP4). Cuidado com o tamanho em disco.
      - ./recordings:/app/recordings

    # Segmentos HLS são descartáveis: mantê-los em RAM evita desgaste do SSD.
    tmpfs:
      - /app/hls:size=64m,mode=1777

    # NÃO mapamos /dev/video0: aqui a câmera é acessada pela rede (RTSP).

    restart: unless-stopped
